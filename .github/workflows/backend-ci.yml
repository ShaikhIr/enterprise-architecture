name: Backend CI

# NOTE: this file must live at the repository root (.github/workflows/).
# GitHub Actions does not read workflows from subdirectories, so the earlier
# stubs under backend/.github/workflows/ were never executed.

on:
  push:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, type check, migrations, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compliance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # asyncpg URLs. The test database name must end with `_test`; conftest
      # refuses to run otherwise, which prevents tests targeting a real database.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/compliance_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/compliance_ci_test
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        # pyproject.toml is the single source of truth for dependencies;
        # requirements/*.txt are unused stubs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Type check (mypy strict)
        # Tests and scripts are checked too, not just src. Test code is the thing
        # asserting the app is correct; an untyped test can quietly assert nothing.
        run: mypy src tests scripts

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations match models
        # Fails if the ORM models have drifted from migration history, i.e.
        # someone changed a model without generating a migration.
        run: alembic check

      - name: Tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
