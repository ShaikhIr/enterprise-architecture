# =============================================================
# Reference nginx configuration for the Enterprise Architecture SPA.
#
# Serves the built frontend (frontend/dist) and reverse-proxies /api/ to the
# FastAPI backend. The SPA calls the API on a relative path (/api/v1), so both
# are always served from ONE origin; that is what lets the security headers
# below be this strict.
#
# Deployment-specific values to set (search for "SET"):
#   - the backend address in `proxy_pass` under `location /api/`
#   - `root` if the build is not mounted at /usr/share/nginx/html
#   - TLS is expected to end in front of this server (HSTS below assumes HTTPS)
#
# This file is the reference for three WAPT findings:
#   WAPT EMC-WA-2  nginx version disclosed on the 404 page
#   WAPT EMC-WA-3  'unsafe-inline' in the CSP style-src
#   WAPT EMC-WA-4  Cross-Origin-Embedder-Policy / Cross-Origin-Resource-Policy missing
# =============================================================

# =============================================================
# Cache-Control is resolved from the request URI so that every
# security header can be declared exactly once, at server level.
#
# nginx discards ALL inherited add_header directives as soon as a
# location block declares its own. Per-location add_header blocks
# therefore silently drop CSP/COOP/nosniff. The map avoids that.
#
# Evaluation order: literal keys first, then regexes in order.
# =============================================================
map $uri $app_cache_control {
    default            "no-cache";
    # The HTML shell carries a per-response CSP nonce (see below), so no copy of
    # it may ever be reused: a cached page would pair an old nonce with a new
    # policy header and lose its styles.
    /index.html        "no-store";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~^/api/            "private, no-store";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # Do not advertise the nginx version                (EMC-WA-2)
    # =========================================================
    # Removes the version from the Server header and from the footer of nginx's
    # built-in error pages. Custom error pages (bottom of this file) go further
    # and name nothing at all. If this file is only one of several server blocks,
    # also set it once in the http {} block of nginx.conf.
    server_tokens off;

    # =========================================================
    # Security Headers
    # =========================================================
    # Superseded by CSP frame-ancestors, kept for legacy scanners.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # EMC-WA-4. Every sub-resource the app loads is same-origin (the CSP below
    # allows nothing else), so require-corp costs nothing and cross-origin
    # isolation makes the document harder to leak from.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    add_header Cache-Control $app_cache_control always;

    # ---------------------------------------------------------
    # Content Security Policy                           (EMC-WA-3)
    #
    # style-src is 'self' plus a per-response nonce. There is no 'unsafe-inline'.
    #
    # PrimeReact >= 10.6 ships primereact.min.css empty and injects its structural
    # CSS at runtime as <style> elements, so a policy without 'unsafe-inline' needs
    # those elements to carry a nonce. They do: the SPA reads the nonce from
    # <meta name="csp-nonce"> in index.html and hands it to PrimeReactProvider
    # (frontend/src/shared/utils/cspNonce.ts), and PrimeReact stamps it on every
    # <style> it creates.
    #
    # The nonce is $request_id: 128 random bits, new for every request. The same
    # value is written into the policy here and, by the sub_filter in
    # `location = /index.html` below, into the page, so the two always agree.
    # nginx draws $request_id from OpenSSL's CSPRNG when built with OpenSSL (the
    # official images are; `nginx -V` lists --with-http_ssl_module). Without OpenSSL
    # it falls back to a weak generator, which is not acceptable for a nonce.
    #
    # A nonce authorises <style> elements, not style="" attributes. React sets
    # styles through the CSSOM (element.style.x = ...), which CSP does not restrict,
    # so React inline styles are fine. What a nonce cannot cover is a style
    # attribute arriving as markup, e.g. dangerouslySetInnerHTML. The one place that
    # did that (the JSON viewer's colours) now uses CSS classes. Keep it that way:
    # if a style attribute is ever injected as a string, the browser console shows
    # "Refused to apply inline style" and the fix is a class, not 'unsafe-inline'.
    #
    # script-src stays 'self': no JS is inlined.
    #
    # frame-ancestors replaces X-Frame-Options (CSP supersedes it).
    # ---------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # =========================================================
    # Gzip Compression
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # =========================================================
    # Hashed build assets
    #
    # =404 rather than SPA fallback: a missing chunk must fail
    # loudly instead of returning index.html with a 200 and a
    # text/html content type.
    # =========================================================
    location /assets/ {
        try_files $uri =404;
    }

    # =========================================================
    # HTML shell: write this response's CSP nonce into the page
    #
    # Every SPA route ends up here: the `index` directive and the
    # try_files fallback below both redirect internally to /index.html.
    #
    # sub_filter also drops Last-Modified and ETag from the response, and
    # etag / if_modified_since are switched off as well, so there is nothing for
    # a browser to revalidate. A 304 would hand it the old body (old nonce)
    # next to a new policy header (new nonce) and lose every runtime style.
    # Cache-Control: no-store (see the map) is the second lock on the same door.
    #
    # Declares no add_header on purpose: the server-level ones must still apply.
    # =========================================================
    location = /index.html {
        sub_filter '__CSP_NONCE__' $request_id;
        sub_filter_once on;
        etag off;
        if_modified_since off;
    }

    # =========================================================
    # SPA Fallback
    # =========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # API Reverse Proxy
    # =========================================================
    location /api/ {
        # SET: the address of the backend service.
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API accepts uploads up to STORAGE_MAX_UPLOAD_BYTES (25 MiB by default);
        # nginx's own default of 1m would answer 413 first. Set a little above the
        # API's limit so the API's own, clearer error is the one the user sees.
        client_max_body_size 26m;

        # A bulk employee import is a single long request (the Vite dev proxy allows
        # 10 minutes for the same reason). nginx's default of 60 s would cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =========================================================
    # Login throttling needs the real client address
    #
    # The API rate-limits POST /api/v1/auth/login per client IP. It reads the address
    # from X-Forwarded-For, counted from the right by TRUSTED_PROXY_HOPS in the
    # backend's .env, so that value MUST equal the number of proxies in front of it:
    #
    #   client -> this nginx -> api                    TRUSTED_PROXY_HOPS=1
    #   client -> load balancer -> this nginx -> api   TRUSTED_PROXY_HOPS=2
    #
    # Left at 0, every user appears to come from this nginx and shares one budget. Too
    # high, and the API trusts entries the client wrote. The API must be reachable only
    # through this chain. The backend logs `trusted_proxy_hops_too_low` /
    # `trusted_proxy_chain_shorter_than_hops` once if it sees the setting is wrong.
    # =========================================================

    # =========================================================
    # Generic error pages                               (EMC-WA-2)
    #
    # nginx's own error responses (a missing /assets/ file, a bad request, an
    # upstream that is down) otherwise carry a built-in page that names the
    # server. These say nothing about the infrastructure and carry no inline
    # styles, so they satisfy the CSP above.
    #
    # `return 200` inside an error_page target is correct: without an =code on
    # error_page, nginx sends the ORIGINAL status (404, 502, ...) with this body.
    # Responses that come from the API itself (proxy_intercept_errors is off) are
    # not touched, so the SPA still sees the API's own JSON errors.
    # =========================================================
    error_page 400 403 404 405 408 411 413 414 431 /_errors/client.html;
    error_page 500 501 502 503 504 /_errors/server.html;

    location = /_errors/client.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Request could not be completed</title></head>
<body>
<h1>Request could not be completed</h1>
<p>The page or file you asked for is not available. <a href="/">Return to the application</a>.</p>
</body>
</html>
';
    }

    location = /_errors/server.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Service unavailable</title></head>
<body>
<h1>Service temporarily unavailable</h1>
<p>The service could not complete your request. Please try again shortly.</p>
</body>
</html>
';
    }
}
